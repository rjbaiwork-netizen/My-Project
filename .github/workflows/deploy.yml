name: Production CI/CD

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  production:
    name: Build, self-heal secrets, deploy and live-test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install

      - name: Compile shared contracts
        run: npm run build:shared

      - name: Compile frontend
        run: npm run build:frontend

      - name: Compile backend
        env:
          DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build
        run: npm run build:backend

      - name: Validate automation deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${BACKEND_URL}"
          test -n "${FRONTEND_URL}"
          echo "✓ Automation live-test endpoints configured"
        env:
          BACKEND_URL: https://my-project-production-9cd9.up.railway.app
          FRONTEND_URL: https://my-project-mk2x.onrender.com

      - name: Automation Builder live E2E
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          BACKEND_URL: https://my-project-production-9cd9.up.railway.app
          FRONTEND_URL: https://my-project-mk2x.onrender.com
        run: bash scripts/automation-e2e.sh

      - name: AI Agent live E2E
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          BACKEND_URL: https://my-project-production-9cd9.up.railway.app
        run: bash scripts/agent-e2e.sh
