name: Production CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deployment-handoff:
    name: Production deployment handoff
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify production source
        shell: bash
        run: |
          set -euo pipefail

          echo "✓ GitHub commit: ${GITHUB_SHA}"
          echo "✓ Branch: ${GITHUB_REF_NAME}"
          echo "✓ Railway source: rjbaiwork-netizen/My-Project"
          echo "✓ Render source: rjbaiwork-netizen/My-Project"

      - name: Railway deployment handoff
        shell: bash
        run: |
          set -euo pipefail

          echo "==> Railway is connected directly to the GitHub repository."
          echo "==> Push to main triggers Railway's connected-source deployment."
          echo "==> Railway API credentials are intentionally not required here."
          echo "✓ Railway deployment handoff complete."

      - name: Render deployment handoff
        shell: bash
        run: |
          set -euo pipefail

          echo "==> Render auto-deploys the connected main branch."
          echo "==> Push to main triggers the Render deployment automatically."
          echo "✓ Render deployment handoff complete."

      - name: Production deployment summary
        shell: bash
        run: |
          echo "=============================================="
          echo "Production deployment handoff completed"
          echo "Commit: ${GITHUB_SHA}"
          echo "Railway: connected-source auto deployment"
          echo "Render: connected-source auto deployment"
          echo "=============================================="
