name: Production CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  RENDER_API_KEY: ${{ secrets.RenderAPIKeys }}
  RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify deployment inputs
        shell: bash
        run: |
          set -euo pipefail

          [[ -n "${RENDER_API_KEY}" ]] || { echo "::error::RenderAPIKeys is not configured."; exit 1; }
          [[ -n "${RENDER_SERVICE_ID}" ]] || { echo "::error::RENDER_SERVICE_ID is not configured."; exit 1; }

          echo "✓ Render deployment secrets are present."
          echo "✓ Commit: ${GITHUB_SHA}"
          echo "✓ Railway deployment is handled by Railway's connected GitHub source."

      - name: Railway deployment handoff
        shell: bash
        run: |
          set -euo pipefail

          echo "==> Railway is connected directly to rjbaiwork-netizen/My-Project."
          echo "==> A push to main triggers Railway's GitHub deployment automatically."
          echo "==> This workflow does not require a Railway API token."
          echo "✓ Railway deployment handoff complete."

      - name: Trigger Render deployment
        id: render
        shell: bash
        run: |
          set -euo pipefail

          echo "==> Triggering Render service ${RENDER_SERVICE_ID} for commit ${GITHUB_SHA}..."

          response="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            --header "Accept: application/json" \
            --header "Content-Type: application/json" \
            --header "Authorization: Bearer ${RENDER_API_KEY}" \
            --data "{\"commitId\":\"${GITHUB_SHA}\",\"clearCache\":\"do_not_clear\"}")"

          deploy_id="$(printf '%s' "${response}" | jq -r '.id // .deploy.id // empty')"

          if [[ -z "${deploy_id}" ]]; then
            echo "::error::Render API did not return a deployment ID."
            printf '%s\n' "${response}"
            exit 1
          fi

          echo "render_deploy_id=${deploy_id}" >> "${GITHUB_OUTPUT}"
          echo "✓ Render deployment queued: ${deploy_id}"

      - name: Wait for Render deployment
        shell: bash
        env:
          RENDER_DEPLOY_ID: ${{ steps.render.outputs.render_deploy_id }}
        run: |
          set -euo pipefail

          echo "==> Waiting for Render deployment ${RENDER_DEPLOY_ID}..."

          for attempt in {1..60}; do
            response="$(curl --fail-with-body --silent --show-error \
              --url "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys/${RENDER_DEPLOY_ID}" \
              --header "Accept: application/json" \
              --header "Authorization: Bearer ${RENDER_API_KEY}")"

            status="$(printf '%s' "${response}" | jq -r '.status // .deploy.status // "unknown"')"

            echo "[Render] attempt ${attempt}/60 — status=${status}"

            case "${status}" in
              live)
                echo "✓ Render deployment is LIVE."
                exit 0
                ;;
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                echo "::error::Render deployment failed with status: ${status}"
                printf '%s\n' "${response}"
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "::error::Render deployment did not reach LIVE state within 10 minutes."
          exit 1

      - name: Production deployment summary
        if: success()
        shell: bash
        run: |
          echo "=============================================="
          echo "Production deployment workflow completed"
          echo "Commit:  ${GITHUB_SHA}"
          echo "Railway: GitHub-connected deployment triggered by push"
          echo "Render: frontend deployment is LIVE"
          echo "=============================================="
