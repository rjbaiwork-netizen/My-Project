name: Live AI + CMS Production E2E

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "apps/frontend/app/api/admin/feature-registry/registry.json"

permissions:
  contents: read

jobs:
  live-production-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Add this repository Actions secret to enable authenticated production AI E2E.
      ADMIN_LOGIN_PASSWORD: ${{ secrets.ADMIN_LOGIN_PASSWORD }}
    steps:
      - name: Wait for Railway backend readiness
        env:
          API_BASE: https://my-project-production-9cd9.up.railway.app
        run: |
          set -euo pipefail
          READY=0
          for i in {1..36}; do
            if curl -fsS --max-time 10 "$API_BASE/ready" >/tmp/ready.json; then
              if node -e 'const x=require("/tmp/ready.json");process.exit(x.status==="ready"&&x.database==="ready"&&x.worker?.started===true?0:1)'; then
                cat /tmp/ready.json
                READY=1
                break
              fi
            fi
            echo "Waiting for backend/database/worker readiness ($i/36)"
            sleep 10
          done
          test "$READY" -eq 1 || { cat /tmp/ready.json 2>/dev/null || true; exit 1; }

      - name: Live CMS and frontend integration smoke test
        env:
          API_BASE: https://my-project-production-9cd9.up.railway.app
          FRONTEND_URL: https://my-project-mk2x.onrender.com
        run: |
          set -euo pipefail
          READY=0
          for i in {1..36}; do
            if curl -fsS --max-time 10 "$FRONTEND_URL/" >/tmp/homepage.html; then READY=1; break; fi
            echo "Waiting for Render public homepage ($i/36)"
            sleep 10
          done
          test "$READY" -eq 1 || { cat /tmp/homepage.html 2>/dev/null || true; exit 1; }

          node <<'NODE'
          const api = process.env.API_BASE.replace(/\/$/, "");
          const front = process.env.FRONTEND_URL.replace(/\/$/, "");
          let sessionCookie = "";
          async function get(url) {
            const r = await fetch(url, { headers: sessionCookie ? { cookie: sessionCookie } : {}, cache: "no-store" });
            const raw = await r.text();
            let body;
            try { body = JSON.parse(raw); } catch { body = null; }
            if (!r.ok) throw new Error(`GET ${url} -> HTTP ${r.status}: ${raw.slice(0,300)}`);
            return { r, raw, body };
          }
          async function send(url, method, body) {
            const r = await fetch(url, {
              method,
              headers: { "content-type": "application/json", origin: new URL(url).origin, ...(sessionCookie ? { cookie: sessionCookie } : {}) },
              body: JSON.stringify(body),
              cache: "no-store"
            });
            const raw = await r.text();
            let payload;
            try { payload = JSON.parse(raw); } catch { payload = null; }
            if (!r.ok || payload?.success !== true) throw new Error(`${method} ${url} -> HTTP ${r.status}: ${raw.slice(0,400)}`);
            return payload;
          }

          const health = await get(api + "/health");
          if (health.body?.status !== "ok") throw new Error("Backend health contract failed");
          const publicSections = await get(api + "/api/sections");
          if (publicSections.body?.success !== true || !Array.isArray(publicSections.body.data)) throw new Error("Backend public CMS endpoint contract failed");
          if (publicSections.body.data.length < 10) throw new Error(`Expected 10 seeded CMS sections; got ${publicSections.body.data.length}`);
          if (!publicSections.body.data.some(s => s.isVisible === true)) throw new Error("No visible CMS section exists; public homepage would remain empty");
          console.log(`PASS backend health + public CMS: ${publicSections.body.data.length} sections, ${publicSections.body.data.filter(s=>s.isVisible).length} visible`);

          if (!process.env.ADMIN_LOGIN_PASSWORD) {
            const adminSecurityChecks = [
              { path: "/api/admin/sections", method: "GET" },
              { path: "/api/admin/workspace", method: "GET" },
              { path: "/api/admin/monitor", method: "GET" },
              { path: "/api/admin/sections/security-probe", method: "PATCH" },
              { path: "/api/admin/workspace", method: "PATCH" }
            ];
            for (const check of adminSecurityChecks) {
              let denied;
              for (let i = 0; i < 36; i++) {
                denied = await fetch(front + check.path, {
                  method: check.method,
                  headers: check.method === "PATCH" ? { origin: front, "content-type": "application/json" } : {},
                  body: check.method === "PATCH" ? JSON.stringify({ title: "security-probe", content: {} }) : undefined,
                  cache: "no-store"
                });
                if (denied.status === 401) break;
                console.log("Waiting for the latest Render admin security deployment on " + check.path + " (" + (i + 1) + "/36); HTTP " + denied.status);
                await new Promise(resolve => setTimeout(resolve, 10000));
              }
              if (denied?.status !== 401) throw new Error("Unauthenticated admin access to " + check.path + " (" + check.method + ") must return HTTP 401 after the proxy-origin fix; got " + denied?.status);
              console.log("PASS unauthenticated admin access blocked: " + check.method + " " + check.path + " -> HTTP " + denied.status);
            }
            console.log("Authenticated CMS CRUD E2E skipped because ADMIN_LOGIN_PASSWORD Actions secret is not configured");
          } else {
            const login = await fetch(front + "/api/admin/login", {
              method: "POST",
              headers: { "content-type": "application/json", origin: front },
              body: JSON.stringify({ password: process.env.ADMIN_LOGIN_PASSWORD }),
              cache: "no-store"
            });
            if (!login.ok) throw new Error("CMS E2E admin login failed with HTTP " + login.status);
            const setCookie = login.headers.get("set-cookie") || "";
            const match = setCookie.match(/my_project_admin_session=([^;]+)/);
            if (!match) throw new Error("CMS E2E login did not issue the expected session cookie");
            sessionCookie = "my_project_admin_session=" + match[1];
            const session = await fetch(front + "/api/admin/session", { headers: { cookie: sessionCookie }, cache: "no-store" });
            const sessionState = await session.json();
            if (!session.ok || sessionState.authenticated !== true) throw new Error("CMS E2E admin session verification failed");
            const admin = await get(front + "/api/admin/sections");
            if (admin.body?.success !== true || !Array.isArray(admin.body.data) || admin.body.data.length < 10) throw new Error("Authenticated CMS admin proxy contract failed");
            const section = admin.body.data[0];
            const updated = await send(front + "/api/admin/sections/" + encodeURIComponent(section.id), "PATCH", { title: section.title, content: section.content });
            if (updated.data?.id !== section.id || updated.data?.title !== section.title) throw new Error("CMS section update round-trip failed");
            const visibility = await send(front + "/api/admin/sections/" + encodeURIComponent(section.id) + "/visibility", "PATCH", { isVisible: section.isVisible });
            if (visibility.data?.isVisible !== section.isVisible) throw new Error("CMS visibility round-trip failed");
            console.log("PASS authenticated CMS admin proxy + non-destructive update + visibility round-trip");
          }

          const home = await get(front + "/");
          if (!home.raw.includes("This site is being prepared") && !home.raw.includes("No published content")) {
            console.log("PASS public homepage returns published page content");
          } else {
            throw new Error("Public homepage still displays the no-published-content placeholder");
          }
          const adminPage = await fetch(front + "/admin/system-config", { cache: "no-store" });
          if (!adminPage.ok) throw new Error(`Admin System Configuration page returned HTTP ${adminPage.status}`);
          console.log("PASS public homepage and Admin System Configuration page");
          NODE

      - name: Live AI Agent execution + Automation Builder diagnostics
        env:
          API_BASE: https://my-project-production-9cd9.up.railway.app
          FRONTEND_URL: https://my-project-mk2x.onrender.com
        run: |
          set -euo pipefail
          node <<'NODE'
          const front = process.env.FRONTEND_URL.replace(/\/$/, "");
          // AI endpoints now require the same signed admin session as the live UI.
          const api = front;
          let sessionCookie = "";
          async function authenticate() {
            if (!process.env.ADMIN_LOGIN_PASSWORD) {
              let probe;
              for (let i = 0; i < 36; i++) {
                probe = await fetch(api + "/api/ai/agents", { cache: "no-store" });
                if (probe.status === 401) break;
                console.log("Waiting for latest protected AI backend (" + (i + 1) + "/36); HTTP " + probe.status);
                await new Promise(resolve => setTimeout(resolve, 10000));
              }
              if (probe?.status !== 401) throw new Error("Unauthenticated AI access must return HTTP 401 after deployment; got " + probe?.status);
              console.log("PASS unauthenticated AI access is blocked; authenticated E2E skipped because ADMIN_LOGIN_PASSWORD Actions secret is not configured");
              process.exit(0);
            }
            const response = await fetch(front + "/api/admin/login", {
              method: "POST",
              headers: { "content-type": "application/json", origin: front },
              body: JSON.stringify({ password: process.env.ADMIN_LOGIN_PASSWORD }),
              cache: "no-store"
            });
            if (!response.ok) throw new Error("Admin login failed with HTTP " + response.status);
            const setCookie = response.headers.get("set-cookie") || "";
            const cookie = setCookie.match(/my_project_admin_session=([^;]+)/);
            if (!cookie) throw new Error("Admin login did not issue the expected session cookie");
            sessionCookie = "my_project_admin_session=" + cookie[1];
            const session = await fetch(front + "/api/admin/session", { headers: { cookie: sessionCookie }, cache: "no-store" });
            const state = await session.json();
            if (!session.ok || state.authenticated !== true) throw new Error("Admin session verification failed");
            console.log("PASS admin login + signed session verification");
          }
          async function request(path, options = {}) {
            const r = await fetch(api + path, {
              ...options,
              headers: { "content-type": "application/json", ...(sessionCookie ? { cookie: sessionCookie } : {}), ...(options.headers || {}) }
            });
            const raw = await r.text();
            let body;
            try { body = JSON.parse(raw); } catch { body = null; }
            if (!r.ok) throw new Error(`${options.method || "GET"} ${path} -> HTTP ${r.status}: ${raw.slice(0,300)}`);
            return body;
          }

          await authenticate();
          const diagnostic = await request("/api/ai/automations/diagnose", {
            method: "POST",
            body: JSON.stringify({
              name: "Production E2E diagnostic",
              trigger: { type: "manual" },
              conditions: [{ field: "flag", operator: "equals", value: "ready" }],
              actions: [{ type: "store-memory", content: "non-mutating-diagnostic-check" }]
            })
          });
          if (diagnostic.success !== true || diagnostic.data?.valid !== true) throw new Error("Automation diagnostic endpoint failed");
          const overview = await request("/api/ai/agent-automation");
          if (overview.success !== true || !Array.isArray(overview.data?.agents) || !Array.isArray(overview.data?.automations)) throw new Error("Agent/automation workspace contract failed");

          const agents = await request("/api/ai/agents");
          const agent = agents.data?.find(a => a.status === "ACTIVE");
          if (!agent) throw new Error("No active AI agent available for live execution");
          const queued = await request(`/api/ai/agents/${agent.id}/run`, {
            method: "POST",
            body: JSON.stringify({ input: { source: "production-e2e", message: "Return a short confirmation that the production AI agent execution path works." } })
          });
          const runId = queued.data?.id;
          if (queued.success !== true || !runId) throw new Error("AI agent run was not queued");
          let finished;
          for (let i = 0; i < 24; i++) {
            const history = await request(`/api/ai/agents/${agent.id}/runs`);
            finished = history.data?.find(run => run.id === runId);
            if (finished?.status === "SUCCEEDED") break;
            if (finished?.status === "FAILED") throw new Error(`AI agent execution failed: ${finished.error || "unknown"}`);
            await new Promise(resolve => setTimeout(resolve, 5000));
          }
          if (finished?.status !== "SUCCEEDED" || !finished.output?.text) throw new Error("AI agent did not finish successfully");
          console.log("PASS agent execution + run history + automation diagnosis + workspace overview");

          for (const path of ["/aisystem/automation-builder", "/aisystem/agent-dashboard"]) {
            const page = await fetch(front + path, { cache: "no-store" });
            if (!page.ok) throw new Error(`Frontend ${path} returned HTTP ${page.status}`);
            console.log(`PASS frontend route ${path}`);
          }
          NODE

      - name: Capture sanitized AI provider health diagnostics
        env:
          FRONTEND_URL: https://my-project-mk2x.onrender.com
        run: |
          node <<'NODE'
          const base = process.env.FRONTEND_URL.replace(/\/$/, "");
          let cookie = "";
          if (process.env.ADMIN_LOGIN_PASSWORD) {
            const login = await fetch(base + "/api/admin/login", {
              method: "POST",
              headers: { "content-type": "application/json", origin: base },
              body: JSON.stringify({ password: process.env.ADMIN_LOGIN_PASSWORD }),
              cache: "no-store"
            });
            if (!login.ok) throw new Error("Provider diagnostics admin login failed: HTTP " + login.status);
            const setCookie = login.headers.get("set-cookie") || "";
            const match = setCookie.match(/my_project_admin_session=([^;]+)/);
            if (!match) throw new Error("Provider diagnostics login did not return a session cookie");
            cookie = "my_project_admin_session=" + match[1];
          } else {
            for (const path of ["/api/ai/providers", "/api/ai/providers/events?limit=12", "/api/ai/provider-integrations"]) {
              let denied;
              for (let i = 0; i < 36; i++) {
                denied = await fetch(base + path, { cache: "no-store" });
                if (denied.status === 401) break;
                console.log("Waiting for the latest Render security deployment on " + path + " (" + (i + 1) + "/36); HTTP " + denied.status);
                await new Promise(resolve => setTimeout(resolve, 10000));
              }
              if (denied?.status !== 401) throw new Error("Unauthenticated access to " + path + " must return HTTP 401 after deployment; got " + denied?.status);
              console.log("PASS unauthenticated access blocked: " + path);
            }
            console.log("Authenticated provider diagnostics skipped because ADMIN_LOGIN_PASSWORD Actions secret is not configured");
            process.exit(0);
          }
          for (const path of ["/api/ai/providers", "/api/ai/providers/events?limit=12"]) {
            try {
              const response = await fetch(base + path, { headers: { cookie }, cache: "no-store" });
              const body = await response.json();
              if (!response.ok || body.success !== true) {
                console.log(JSON.stringify({ path, status: response.status, available: false }));
                continue;
              }
              if (path === "/api/ai/providers") {
                console.log(JSON.stringify({ path, status: response.status, providers: (body.data?.providers ?? []).map(p => ({
                  id: p.id, keyConfigured: p.keyConfigured, health: p.health,
                  productionModel: p.models?.production
                })) }, null, 2));
              } else {
                console.log(JSON.stringify({ path, status: response.status, events: (body.data ?? []).map(e => ({
                  provider: e.provider, purpose: e.purpose, operation: e.operation,
                  success: e.success, statusCode: e.statusCode ?? null,
                  model: e.model ?? null, fallbackFrom: e.fallbackFrom ?? null
                })) }, null, 2));
              }
            } catch (error) {
              console.log(JSON.stringify({ path, available: false, error: error instanceof Error ? error.message : "request failed" }));
            }
          }
          NODE

      - name: Live AI Chat + Knowledge + Memory E2E
        env:
          FRONTEND_URL: https://my-project-mk2x.onrender.com
        run: |
          set -euo pipefail

          node <<'NODE'
          const base = process.env.FRONTEND_URL.replace(/\/$/, "");
          const ids = { conversations: [], memories: [], knowledge: [] };
          let sessionCookie = "";

          async function authenticate() {
            if (!process.env.ADMIN_LOGIN_PASSWORD) {
              let probe;
              for (let i = 0; i < 36; i++) {
                probe = await fetch(base + "/api/ai/conversations", { cache: "no-store" });
                if (probe.status === 401) break;
                console.log("Waiting for latest protected AI conversation endpoint (" + (i + 1) + "/36); HTTP " + probe.status);
                await new Promise(resolve => setTimeout(resolve, 10000));
              }
              if (probe?.status !== 401) throw new Error("Unauthenticated AI conversation access must return HTTP 401 after deployment; got " + probe?.status);
              console.log("PASS unauthenticated AI access is blocked; Chat/Knowledge/Memory E2E skipped because ADMIN_LOGIN_PASSWORD Actions secret is not configured");
              process.exit(0);
            }
            const response = await fetch(base + "/api/admin/login", {
              method: "POST",
              headers: { "content-type": "application/json", origin: base },
              body: JSON.stringify({ password: process.env.ADMIN_LOGIN_PASSWORD }),
              cache: "no-store"
            });
            if (!response.ok) throw new Error("Chat E2E admin login failed with HTTP " + response.status);
            const setCookie = response.headers.get("set-cookie") || "";
            const cookie = setCookie.match(/my_project_admin_session=([^;]+)/);
            if (!cookie) throw new Error("Chat E2E login did not issue the expected session cookie");
            sessionCookie = "my_project_admin_session=" + cookie[1];
            const session = await fetch(base + "/api/admin/session", { headers: { cookie: sessionCookie }, cache: "no-store" });
            const state = await session.json();
            if (!session.ok || state.authenticated !== true) throw new Error("Chat E2E admin session verification failed");
            console.log("PASS Chat E2E admin login + signed session verification");
          }

          async function request(path, options = {}) {
            const res = await fetch(base + path, {
              ...options,
              headers: { "content-type": "application/json", ...(sessionCookie ? { cookie: sessionCookie } : {}), ...(options.headers || {}) }
            });
            const text = await res.text();
            let body;
            try { body = JSON.parse(text); } catch { body = { raw: text }; }
            if (!res.ok) throw new Error(`${options.method || "GET"} ${path} -> ${res.status}: ${text}`);
            return body;
          }

          async function cleanup() {
            for (const id of ids.conversations) {
              try { await request("/api/ai/conversations/" + id, { method: "DELETE" }); } catch {}
            }
            for (const id of ids.memories) {
              try { await request("/api/ai/memories/" + id, { method: "DELETE" }); } catch {}
            }
            for (const id of ids.knowledge) {
              try { await request("/api/ai/knowledge/" + id, { method: "DELETE" }); } catch {}
            }
          }

          try {
            await authenticate();
            const marker = "LIVE-E2E-" + Date.now();
            const conversations = await request("/api/ai/conversations");
            if (conversations.success !== true || !Array.isArray(conversations.data)) throw new Error("Conversation list contract failed");
            const knowledge = await request("/api/ai/knowledge");
            if (knowledge.success !== true || !Array.isArray(knowledge.data)) throw new Error("Knowledge list contract failed");

            const knowledgeCreate = await request("/api/ai/knowledge", { method: "POST", body: JSON.stringify({
              title: `Live E2E Knowledge ${marker}`,
              content: `Verified knowledge phrase for ${marker}: My-Project AI core integration test.`,
              source: "live-e2e"
            })});
            const knowledgeId = knowledgeCreate.data?.id;
            if (knowledgeCreate.success !== true || !knowledgeId || !knowledgeCreate.data?.embedding) throw new Error("Knowledge creation/indexing contract failed");
            ids.knowledge.push(knowledgeId);

            const knowledgeSearch = await request("/api/ai/knowledge/search?q=" + encodeURIComponent(marker));
            if (knowledgeSearch.success !== true || !knowledgeSearch.data?.some(k => k.id === knowledgeId)) throw new Error("Knowledge search contract failed");
            const knowledgeUpdate = await request("/api/ai/knowledge/" + knowledgeId, { method: "PATCH", body: JSON.stringify({ content: `Updated verified knowledge phrase for ${marker}: integration update.` })});
            if (knowledgeUpdate.success !== true || !knowledgeUpdate.data?.embedding) throw new Error("Knowledge update/re-index contract failed");

            const manualMemory = await request("/api/ai/memories", { method: "POST", body: JSON.stringify({ content: `Manual memory verification phrase ${marker} should be retrievable.`, namespace: "live-e2e" })});
            const manualMemoryId = manualMemory.data?.id;
            if (manualMemory.success !== true || !manualMemoryId || !manualMemory.data?.embedding) throw new Error("Manual memory creation/embedding contract failed");
            ids.memories.push(manualMemoryId);
            const memoryUpdate = await request("/api/ai/memories/" + manualMemoryId, { method: "PATCH", body: JSON.stringify({ content: `Updated manual memory verification phrase ${marker} remains retrievable.` })});
            if (memoryUpdate.success !== true || !memoryUpdate.data?.embedding) throw new Error("Memory update/re-embedding contract failed");
            const memorySearch = await request("/api/ai/memories/search?q=" + encodeURIComponent(marker));
            if (memorySearch.success !== true || !memorySearch.data?.some(m => m.id === manualMemoryId)) throw new Error("Memory search contract failed");

            const chat = await request("/api/ai/chat", { method: "POST", body: JSON.stringify({ message: `Reply briefly and include this verification marker exactly: ${marker}` })});
            if (chat.success !== true || !chat.data?.conversationId || !chat.data?.answer) throw new Error("Chat response contract failed");
            ids.conversations.push(chat.data.conversationId);
            if (!chat.data.answer.includes(marker)) throw new Error("AI response did not contain the verification marker");
            if (!Array.isArray(chat.data.knowledge) || !Array.isArray(chat.data.memories)) throw new Error("Chat context contract failed");
            if (!chat.data.knowledge.some(k => k.id === knowledgeId)) throw new Error("Chat did not retrieve live knowledge");
            if (!chat.data.memories.some(m => m.id === manualMemoryId)) throw new Error("Chat did not retrieve live memory");

            const conversationId = chat.data.conversationId;
            const followup = await request("/api/ai/chat", { method: "POST", body: JSON.stringify({ conversationId, message: `Confirm the marker from our conversation: ${marker}` })});
            if (followup.success !== true || followup.data?.conversationId !== conversationId) throw new Error("Conversation continuation contract failed");
            const renamed = await request("/api/ai/conversations/" + conversationId, { method: "PATCH", body: JSON.stringify({ title: `E2E ${marker}` })});
            if (renamed.success !== true || renamed.data?.title !== `E2E ${marker}`) throw new Error("Conversation rename contract failed");
            const conversation = await request("/api/ai/conversations/" + conversationId);
            if (conversation.success !== true || !Array.isArray(conversation.data?.messages)) throw new Error("Conversation persistence contract failed");
            const roles = conversation.data.messages.map(m => m.role);
            if (!roles.includes("user") || !roles.includes("assistant") || conversation.data.messages.length < 4) throw new Error("Conversation messages were not persisted");
            const memories = await request("/api/ai/memories");
            if (memories.success !== true || !Array.isArray(memories.data) || !memories.data.some(m => m.conversationId === conversationId)) throw new Error("Conversation memory was not persisted");

            console.log(JSON.stringify({ status: "PASS", knowledgeId, manualMemoryId, retrievedKnowledgeCount: chat.data.knowledge.length, retrievedMemoryCount: chat.data.memories.length, messageCount: conversation.data.messages.length }, null, 2));
          } finally {
            await cleanup();
          }
          NODE
