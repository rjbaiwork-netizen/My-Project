name: Sync GitHub Secrets to My-Project runtimes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-telegram-secrets.yml"

permissions:
  contents: read

concurrency:
  group: sync-production-runtime-secrets
  cancel-in-progress: false

jobs:
  sync-runtime-secrets:
    name: Sync Telegram auth configuration from GitHub Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate required secrets
        shell: bash
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RENDER_API_KEY: ${{ secrets.RENDERAPIKEYS }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          ADMIN_LOGIN_PASSWORD: ${{ secrets.ADMIN_LOGIN_PASSWORD }}
          TELEGRAM_TOTPS_BOT_TOKEN: ${{ secrets.TELEGRAM_TOTPS_BOT_TOKEN }}
          BOT_TELEGRAM_USERNAME: ${{ secrets.BOT_TELEGRAM_USERNAME }}
          BOT_TELEGRAM_USER_ID: ${{ secrets.BOT_TELEGRAM_USER_ID }}
          OWNER_TELEGRAM_USERNAME: ${{ secrets.OWNER_TELEGRAM_USERNAME }}
          OWNER_TELEGRAM_USER_ID: ${{ secrets.OWNER_TELEGRAM_USER_ID }}
        run: |
          set -euo pipefail
          for key in RAILWAY_TOKEN RAILWAY_PROJECT_ID RENDER_API_KEY RENDER_SERVICE_ID ADMIN_LOGIN_PASSWORD TELEGRAM_TOTPS_BOT_TOKEN BOT_TELEGRAM_USERNAME BOT_TELEGRAM_USER_ID OWNER_TELEGRAM_USERNAME OWNER_TELEGRAM_USER_ID; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::Required GitHub Secret is missing: $key"
              exit 1
            fi
          done
          [[ "$BOT_TELEGRAM_USER_ID" =~ ^[0-9]+$ ]] || { echo "::error::BOT_TELEGRAM_USER_ID must be numeric"; exit 1; }
          [[ "$OWNER_TELEGRAM_USER_ID" =~ ^[0-9]+$ ]] || { echo "::error::OWNER_TELEGRAM_USER_ID must be numeric"; exit 1; }
          echo "Required secret names and numeric Telegram IDs validated; values were not printed."

      - name: Sync backend runtime variables to Railway
        shell: bash
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          TELEGRAM_TOTPS_BOT_TOKEN: ${{ secrets.TELEGRAM_TOTPS_BOT_TOKEN }}
          BOT_TELEGRAM_USERNAME: ${{ secrets.BOT_TELEGRAM_USERNAME }}
          BOT_TELEGRAM_USER_ID: ${{ secrets.BOT_TELEGRAM_USER_ID }}
          OWNER_TELEGRAM_USERNAME: ${{ secrets.OWNER_TELEGRAM_USERNAME }}
          OWNER_TELEGRAM_USER_ID: ${{ secrets.OWNER_TELEGRAM_USER_ID }}
          ADMIN_LOGIN_PASSWORD: ${{ secrets.ADMIN_LOGIN_PASSWORD }}
        run: |
          set -euo pipefail
          ADMIN_API_TOKEN="$(printf '%s' "$ADMIN_LOGIN_PASSWORD:my-project-service-auth-v1" | sha256sum | cut -d ' ' -f1)"
          echo "::add-mask::$ADMIN_API_TOKEN"
          npm install --global @railway/cli
          railway link --project "$RAILWAY_PROJECT_ID" --environment "bbb86f7a-4adb-4d60-b790-73276a65958e" --service "8d0e4be9-457d-4b49-b81d-3e375240559a" --json >/dev/null
          railway variable set \
            "TELEGRAM_TOTPS_BOT_TOKEN=$TELEGRAM_TOTPS_BOT_TOKEN" \
            "BOT_TELEGRAM_USERNAME=$BOT_TELEGRAM_USERNAME" \
            "BOT_TELEGRAM_USER_ID=$BOT_TELEGRAM_USER_ID" \
            "OWNER_TELEGRAM_USERNAME=$OWNER_TELEGRAM_USERNAME" \
            "OWNER_TELEGRAM_USER_ID=$OWNER_TELEGRAM_USER_ID" \
            "ADMIN_API_TOKEN=$ADMIN_LOGIN_PASSWORD" \
            --skip-deploys
          railway redeploy --service "8d0e4be9-457d-4b49-b81d-3e375240559a" --environment "bbb86f7a-4adb-4d60-b790-73276a65958e" --project "$RAILWAY_PROJECT_ID" --yes
          echo "Railway runtime variables updated and redeploy requested; secret values were not printed."

      - name: Sync frontend runtime variables to Render
        shell: bash
        env:
          RENDER_API_KEY: ${{ secrets.RENDERAPIKEYS }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          ADMIN_LOGIN_PASSWORD: ${{ secrets.ADMIN_LOGIN_PASSWORD }}
        run: |
          set -euo pipefail
          ADMIN_API_TOKEN="$(printf '%s' "$ADMIN_LOGIN_PASSWORD:my-project-service-auth-v1" | sha256sum | cut -d ' ' -f1)"
          echo "::add-mask::$ADMIN_API_TOKEN"
          api="https://api.render.com/v1/services/$RENDER_SERVICE_ID/env-vars"
          put_var() {
            local key="$1"
            local value="$2"
            local payload
            payload="$(jq -cn --arg value "$value" '{value:$value}')"
            curl --silent --show-error --fail \
              --request PUT "$api/$key" \
              --header "Authorization: Bearer $RENDER_API_KEY" \
              --header "Accept: application/json" \
              --header "Content-Type: application/json" \
              --data "$payload" \
              --output /dev/null
          }
          put_var "ADMIN_API_TOKEN" "$ADMIN_API_TOKEN"
          put_var "NEXT_PUBLIC_API_URL" "https://my-project-production-9cd9.up.railway.app"
          curl --silent --show-error --fail \
            --request POST "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            --header "Accept: application/json" \
            --header "Content-Type: application/json" \
            --data '{"clearCache":"do_not_clear","deployMode":"build_and_deploy"}' \
            --output /dev/null
          echo "Render frontend variables updated and deploy requested; secret values were not printed."
